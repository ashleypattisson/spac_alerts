name: SPAC Alerts
on:
  workflow_dispatch:
    inputs:
      replay:
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python debug_probe.py
          git config user.name "spac-bot"
          git config user.email "spac-bot@users.noreply.github.com"
          git add debug_out
          git commit -q -m "probe output"
          git push -q origin HEAD:debug-probe
